<!DOCTYPE html>
<html lang="bg" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>ivan@nvo: ~</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0e16">
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="stylesheet" href="../css/console.css">
  <script src="../js/console/theme.js"></script>
  <script type="module" src="../js/console/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <div class="stage">
      <main class="term" aria-label="Конзола">
        <div class="term__screen" role="log"></div>
        <div class="term__line" hidden></div>
      </main>
    </div>
    <nav class="keybar" aria-label="Клавиши">
      <button type="button" data-key="Escape">Esc</button>
      <button type="button" data-key="Tab">Tab</button>
      <button type="button" data-key="Ctrl" aria-pressed="false">Ctrl</button>
      <button type="button" data-key="^C" aria-label="Ctrl+C">^C</button>
      <button type="button" data-key="ArrowUp" aria-label="Нагоре">↑</button>
      <button type="button" data-key="ArrowDown" aria-label="Надолу">↓</button>
      <button type="button" data-key="ArrowLeft" aria-label="Наляво">←</button>
      <button type="button" data-key="ArrowRight" aria-label="Надясно">→</button>
      <button type="button" data-key="|">|</button>
      <button type="button" data-key="-">-</button>
      <button type="button" data-key="/">/</button>
      <button type="button" data-key="~">~</button>
    </nav>
  </div>
  <noscript>Конзолата изисква JavaScript.</noscript>
</body>
</html>
