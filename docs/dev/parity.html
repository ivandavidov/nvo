<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Паритет: стара срещу нова логика</title>
  <!-- Вътрешна страница за разработка: сравнява старите logic-*.js с новите js/core модули.
       ?grade=4|7|10|12 [&year=2023]. Изтрива се заедно със старите файлове. -->
  <script>
    window.__NVO_TEST_MODE__ = true;
    var P = new URLSearchParams(location.search);
    var G = P.get('grade') || '7';
    ['highcharts.js', 'config-global.js', 'config-' + G + '.js', 'schools-' + G + '.js',
     'logic-core.js', 'logic-chart.js', 'logic-ranking.js', 'logic-city.js', 'logic-init.js'].forEach(function(f) {
      document.write('<script src="../js/' + f + '"><\/script>');
    });
  </script>
  <style>body{font:14px/1.5 system-ui;margin:2rem}pre{white-space:pre-wrap}</style>
</head>
<body>
  <h1>Паритет</h1>
  <pre id="out">Работи…</pre>
  <div id="sandbox" style="position:absolute;left:-99999px;top:0"></div>
  <script type="module">
    import { buildModel, renderableCities, cityRanking, sortRanking, cityAverages, topGroups,
      csvHeader, cityCsvRows, allCsv, chartSeries } from '../js/core/model.js';
    import { rankingCells } from '../js/core/pdf.js';

    const out = [];
    const errors = [];
    const log = (m) => out.push(m);
    const fail = (m) => { if (errors.length < 60) { errors.push(m); } };
    const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

    const grade = Number(G);
    const yearParam = P.get('year');
    const raw = await (await fetch('../data/grade-' + grade + '.json')).json();
    const model = buildModel(grade, raw, { year: yearParam });

    // --- старият конвейер (onLoad без DOM частите) ---
    window.redraw = function() {};
    calculateTimeTravel();
    fixForYear2018();
    fixForMissingYears();
    disableEntries();
    calculateSchoolMedians();
    calculateCityMediansBySchool();
    calculateCityMediansByAttendees();

    // 1. Данните след трансформациите + медианите на училищата
    let n = 0;
    for (let i = 0; i < Math.max(s.length, model.s.length); i++) {
      const a = s[i]; const b = model.s[i];
      if (!a && !b) { continue; }
      n++;
      for (const k of ['b', 'm', 'bu', 'mu', 'mb', 'mm', 'l', 'n', 'w', 'c']) {
        if (!eq(a[k], b[k])) { fail('s[' + i + '].' + k + ' ' + JSON.stringify(a[k]) + ' ≠ ' + JSON.stringify(b[k])); }
      }
    }
    log('училища: ' + n + ', numYears стар/нов: ' + numYears + '/' + model.numYears + ', timeTravel: ' + timeTravelYear + '/' + model.timeTravelYear);
    if (numYears !== model.numYears) { fail('numYears'); }

    // 2. Средните за градовете
    for (const name of Object.keys(si)) {
      for (const k of ['mnbs', 'mnms', 'mpbs', 'mpms', 'mnba', 'mnma', 'mpba', 'mpma']) {
        if (!eq(si[name][k], model.si[name][k])) { fail('si[' + name + '].' + k); }
      }
    }

    // 3. Градовете, CSV, класациите, Топ N, средните таблици
    const cities = renderableCities(model);
    const oldCities = getRenderableCitiesFromData();
    if (!eq(cities.map((c) => c.name), oldCities.map((c) => c.name))) { fail('списъкът с градове'); }
    if (csvHeader(model) !== generateDownloadCSVHeader()) { fail('CSV заглавие'); }
    let allOld = '';
    oldCities.forEach((c) => { allOld += c.data; });
    if (allCsv(model).content !== generateDownloadCSVHeader() + allOld) { fail('CSV всички'); }

    const sandbox = document.getElementById('sandbox');
    let sorts = 0;
    for (const city of cities) {
      const oc = oldCities.find((c) => c.name === city.name);
      if (cityCsvRows(model, city) !== oc.data) { fail('CSV ' + city.name); }
      if (city.slug !== oc.hrName || city.label !== oc.btName || city.tier !== oc.btPos) { fail('метаданни ' + city.name); }

      // класация
      const div = document.createElement('div');
      sandbox.appendChild(div);
      const state = { sortColumn: 3, sortDirection: 'desc', filterLabel: null };
      buildRankingTable(div, city.name, city.pu, city.pr, state);
      const table = div.querySelector('table');
      const tBody = table.tBodies[0];
      const rows = cityRanking(model, city);
      const cols = [null, 'name', 'type', 'rank', 'y0b', 'y0m', 'y1b', 'y1m', 'y2b', 'y2m'];
      const filters = city.pr ? [null, 'Д', 'Ч'] : [null];
      for (const f of filters) {
        for (let c = 1; c <= 9; c++) {
          for (const dir of ['asc', 'desc']) {
            state.sortColumn = c; state.sortDirection = dir; state.filterLabel = f;
            applyRankingTableState(table, tBody, state);
            const oldRows = [...tBody.rows].filter((r) => r.style.display !== 'none')
              .map((r) => [...r.cells].slice(0, 10).map((td, j) => (j === 1 ? td.textContent.replace(/\s*↗$/, '') : td.textContent).trim()));
            const newRows = sortRanking(model, rows, cols[c], dir, f).map((r, k) => rankingCells(model, r, k + 1, f));
            sorts++;
            if (!eq(oldRows, newRows)) {
              const k = oldRows.findIndex((r, idx) => !eq(r, newRows[idx]));
              fail('класация ' + city.name + ' f=' + f + ' c=' + cols[c] + ' ' + dir + ' ред ' + k + ': ' + JSON.stringify(oldRows[k]) + ' ≠ ' + JSON.stringify(newRows[k]));
            }
          }
        }
      }
      div.remove();

      // средни таблици (по училища / по ученици)
      for (const mode of ['schools', 'students']) {
        const avg = cityAverages(model, city.name, mode);
        const tmp = document.createElement('tbody');
        createMedianTableBody(tmp, city.name, avg.hasPrivate, ...(mode === 'students' ? ['mnba', 'mnma', 'mpba', 'mpma'] : ['mnbs', 'mnms', 'mpbs', 'mpms']));
        const oldAvg = [...tmp.rows].map((r) => [...r.cells].map((td) => td.textContent));
        const newAvg = avg.rows.map((r) => [String(r.year), r.puB, r.puM].concat(avg.hasPrivate ? [r.prB, r.prM] : []));
        if (!eq(oldAvg, newAvg)) { fail('средни ' + mode + ' ' + city.name); }
      }

      // Топ N
      for (const range of [city.pu, city.pr]) {
        if (!range) { continue; }
        const groups = topGroups(model, range);
        const bdiv = document.createElement('div');
        sandbox.appendChild(bdiv);
        const counts = getSchoolCounts(range);
        generateSchoolButtons(bdiv, range, counts.topCount, counts.secondCount);
        const groupBtns = [...bdiv.querySelectorAll('button.mbtn')];
        groupBtns.forEach((btn, gi) => {
          selectedSchoolIndices.clear();
          btn.click();
          const oldSel = [...selectedSchoolIndices].sort((a, b) => a - b);
          const newSel = groups[gi].indices.slice().sort((a, b) => a - b);
          if (!eq(oldSel, newSel)) { fail('Топ група ' + city.name + ' #' + gi + ': ' + oldSel + ' ≠ ' + newSel); }
          btn.click();
        });
        if (groupBtns.length !== groups.length) { fail('брой Топ групи ' + city.name); }
        bdiv.remove();
      }
    }
    log('градове: ' + cities.length + ', сравнени сортирания: ' + sorts);

    // 4. Сериите за графиките (базовите училища + топ 5 на първия град)
    const sel = [...new Set([model.cfg.baseSchoolIndex, model.cfg.refSchoolIndex].concat(topGroups(model, cities[0].pu)[0].indices))];
    selectedSchoolIndices.clear();
    sel.forEach((i) => selectedSchoolIndices.add(i));
    const traces = recalculate();
    for (const subj of ['b', 'm']) {
      const layout = getLayout('t', traces[subj], 'x');
      const mine = chartSeries(model, sel, subj);
      if (!eq(layout.xAxis.categories, mine.categories)) { fail('категории ' + subj); }
      if (!eq(layout.series.map((x) => [x.name, x.data]), mine.series.map((x) => [x.name, x.data]))) { fail('серии ' + subj); }
    }

    log(errors.length ? 'РАЗЛИКИ: ' + errors.length + '\n' + errors.join('\n') : 'OK — 0 разлики');
    document.getElementById('out').textContent = out.join('\n');
    window.__parity = { errors, out };
  </script>
</body>
</html>
